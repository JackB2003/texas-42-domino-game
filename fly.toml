# Fly.io deployment for the Texas 42 server.
# Provision a Redis (e.g. Upstash) and set REDIS_URL + CLIENT_ORIGIN as secrets:
#   fly secrets set REDIS_URL=redis://... CLIENT_ORIGIN=https://your-web-host
app = "your-texas42-app-name"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.server"

[env]
  PORT = "3001"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
